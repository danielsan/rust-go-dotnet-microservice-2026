name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Weekly on Monday 03:00 UTC
    - cron: "0 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-benchmark:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - rust-axum
          - go-fiber
          - dotnet-minimal

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bench
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bench -d bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        if: matrix.target == 'rust-axum'
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        if: matrix.target == 'go-fiber'
        uses: actions/setup-go@v5
        with:
          go-version-file: implementations/go-fiber/go.mod
          cache-dependency-path: implementations/go-fiber/go.sum

      - name: Setup .NET
        if: matrix.target == 'dotnet-minimal'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize database
        env:
          PGPASSWORD: bench
        run: |
          psql -h 127.0.0.1 -U bench -d bench <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE IF NOT EXISTS users (
            id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
            name VARCHAR(100) NOT NULL,
            email VARCHAR(255) NOT NULL UNIQUE,
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL

      - name: Build service
        env:
          DATABASE_URL: postgres://bench:bench@127.0.0.1:5432/bench
          PORT: 3000
        run: |
          case "${{ matrix.target }}" in
            rust-axum)
              cd implementations/rust-axum
              cargo build --release
              ;;
            go-fiber)
              cd implementations/go-fiber
              go build -o microservice .
              ;;
            dotnet-minimal)
              cd implementations/dotnet-minimal/microservice
              dotnet publish -c Release -o publish
              ;;
          esac

      - name: Start service
        env:
          PORT: 3000
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            rust-axum)
              export DATABASE_URL=postgres://bench:bench@127.0.0.1:5432/bench
              (cd implementations/rust-axum && ./target/release/microservice) &
              ;;
            go-fiber)
              export DATABASE_URL=postgres://bench:bench@127.0.0.1:5432/bench
              (cd implementations/go-fiber && ./microservice) &
              ;;
            dotnet-minimal)
              export DATABASE_URL="Host=127.0.0.1;Port=5432;Database=bench;Username=bench;Password=bench"
              (cd implementations/dotnet-minimal/microservice && dotnet publish/microservice.dll) &
              ;;
          esac

          echo $! > service.pid

      - name: Wait for health
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Service failed health check" >&2
          exit 1

      - name: Warmup
        run: |
          wrk -t2 -c50 -d10s http://127.0.0.1:3000/health | tee wrk-warmup.txt

      - name: Benchmark (GET /users)
        run: |
          wrk -t2 -c50 -d15s http://127.0.0.1:3000/users | tee wrk-get-users.txt

      - name: Stop service
        if: always()
        run: |
          if [[ -f service.pid ]]; then
            kill "$(cat service.pid)" || true
          fi

      - name: Write result markdown
        if: always()
        run: |
          {
            echo "# Benchmark Results (${{ matrix.target }})"
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo
            echo "## Warmup"
            echo
            echo "\`\`\`"
            cat wrk-warmup.txt || true
            echo "\`\`\`"
            echo
            echo "## GET /users"
            echo
            echo "\`\`\`"
            cat wrk-get-users.txt || true
            echo "\`\`\`"
          } > result.md

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.target }}
          path: result.md

  open-pr:
    name: Open PR
    runs-on: ubuntu-latest
    needs: [run-benchmark]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/benchmarks

      - name: Generate combined report
        run: |
          set -euo pipefail

          out_dir="artifacts"
          mkdir -p "$out_dir"
          out_file="$out_dir/ci-benchmark-results.md"

          {
            echo "# CI Benchmark Results"
            echo
            echo "Generated by GitHub Actions."
            echo
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Date (UTC): $(date -u +%F)"
            echo
          } > "$out_file"

          for target in rust-axum go-fiber dotnet-minimal; do
            f="/tmp/benchmarks/benchmark-${target}/result.md"
            if [[ -f "$f" ]]; then
              echo >> "$out_file"
              cat "$f" >> "$out_file"
            else
              {
                echo
                echo "# Benchmark Results (${target})"
                echo
                echo "(missing artifact: ${f})"
              } >> "$out_file"
            fi
          done

      - name: Create PR with results
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "Add CI benchmark results"
          title: "Add CI benchmark results"
          body: |
            Adds CI benchmark results generated by GitHub Actions.

            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Commit: ${{ github.sha }}
          branch: "ci/benchmarks-${{ github.run_id }}"
          delete-branch: true

